name: Builder reliability v18.11
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/builder-reliability-v18-11.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch builder and recommendation logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* ===== v18.11: reliable builder + practical recommendation policy ===== */'
          if marker in s:
              raise SystemExit(0)
          s=s.replace('Pokémon Champions Support — v18.10','Pokémon Champions Support — v18.11')
          old="addNeed(u.removal<15,cp.removal,3.2,'場の除去手段を補完');"
          new="addNeed(u.removal<15,cp.removal,.6,null);"
          if old not in s: raise SystemExit('candidate removal weight marker not found')
          s=s.replace(old,new,1)
          old="const utilityChecks=[[u.hazard,1.4],[u.removal,1.7],[u.pivot,1.0],[u.recovery,1.1],[u.setup,1.5],[u.disrupt,1.1],[u.priority,1.0],[u.phys?40:0,1.1],[u.spec?40:0,1.1]];"
          new="const utilityChecks=[[u.hazard,1.4],[u.removal,.35],[u.pivot,1.0],[u.recovery,1.1],[u.setup,1.5],[u.disrupt,1.1],[u.priority,1.0],[u.phys?40:0,1.1],[u.spec?40:0,1.1]];"
          if old not in s: raise SystemExit('team removal weight marker not found')
          s=s.replace(old,new,1)
          old="if(u.removal<15)advice.push('ステロ・まきびし対策（きりばらい/スピン系）が薄い');if(u.setup<15)"
          new="if(u.setup<15)"
          if old not in s: raise SystemExit('removal advice marker not found')
          s=s.replace(old,new,1)
          old="const ctx=v12TeamContext(buildTeam);window.__V12_BUILD_CONTEXT__=ctx;const best=new Map(),allMega=[];\n  for(const m of mons){\n    if(buildTeam.some(x=>sameSpecies(x,m)))continue;const pol=v14FormPolicy(m);if(pol.hardExclude)continue;"
          new="const ctx=v12TeamContext(buildTeam);window.__V12_BUILD_CONTEXT__=ctx;const best=new Map(),allMega=[],currentMegaCount=v15BuildMegaCount();\n  for(const m of mons){\n    if(buildTeam.some(x=>sameSpecies(x,m)))continue;if(m.mega&&currentMegaCount>=2)continue;const pol=v14FormPolicy(m);if(pol.hardExclude)continue;"
          if old not in s: raise SystemExit('v15 candidate loop marker not found')
          s=s.replace(old,new,1)
          patch=base64.b64decode('').decode('utf-8')
          if '</body>' not in s: raise SystemExit('body close marker not found')
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(parts),encoding='utf-8')
          assert 'v18.11: reliable builder' in s
          assert 'addNeed(u.removal<15,cp.removal,.6,null);' in s
          assert 'currentMegaCount>=2' in s
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix builder registration and practical recommendations"
          git push
