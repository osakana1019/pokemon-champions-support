name: Builder reliability v18.11
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/builder-reliability-v18-11.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch builder and recommendation logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* ===== v18.11: reliable builder + practical recommendation policy ===== */'
          if marker in s:
              raise SystemExit(0)

          s=s.replace('Pokémon Champions Support — v18.10','Pokémon Champions Support — v18.11')

          # Hazard removal is uncommon in the current environment. Keep it as a small bonus,
          # not a required role or a recurring construction warning.
          old="addNeed(u.removal<15,cp.removal,3.2,'場の除去手段を補完');"
          new="addNeed(u.removal<15,cp.removal,.6,null);"
          if old not in s:
              raise SystemExit('candidate removal weight marker not found')
          s=s.replace(old,new,1)

          old="const utilityChecks=[[u.hazard,1.4],[u.removal,1.7],[u.pivot,1.0],[u.recovery,1.1],[u.setup,1.5],[u.disrupt,1.1],[u.priority,1.0],[u.phys?40:0,1.1],[u.spec?40:0,1.1]];"
          new="const utilityChecks=[[u.hazard,1.4],[u.removal,.35],[u.pivot,1.0],[u.recovery,1.1],[u.setup,1.5],[u.disrupt,1.1],[u.priority,1.0],[u.phys?40:0,1.1],[u.spec?40:0,1.1]];"
          if old not in s:
              raise SystemExit('team removal weight marker not found')
          s=s.replace(old,new,1)

          old="if(u.removal<15)advice.push('ステロ・まきびし対策（きりばらい/スピン系）が薄い');if(u.setup<15)"
          new="if(u.setup<15)"
          if old not in s:
              raise SystemExit('removal advice marker not found')
          s=s.replace(old,new,1)

          # If two Mega slots are already occupied, do not recommend a third Mega candidate.
          old="const ctx=v12TeamContext(buildTeam);window.__V12_BUILD_CONTEXT__=ctx;const best=new Map(),allMega=[];\n  for(const m of mons){\n    if(buildTeam.some(x=>sameSpecies(x,m)))continue;const pol=v14FormPolicy(m);if(pol.hardExclude)continue;"
          new="const ctx=v12TeamContext(buildTeam);window.__V12_BUILD_CONTEXT__=ctx;const best=new Map(),allMega=[],currentMegaCount=v15BuildMegaCount();\n  for(const m of mons){\n    if(buildTeam.some(x=>sameSpecies(x,m)))continue;if(m.mega&&currentMegaCount>=2)continue;const pol=v14FormPolicy(m);if(pol.hardExclude)continue;"
          if old not in s:
              raise SystemExit('v15 candidate loop marker not found')
          s=s.replace(old,new,1)

          patch=r'''
<script>
/* ===== v18.11: reliable builder + practical recommendation policy ===== */
(function(){
  function v1811PersistBuild(){
    localStorage.setItem('champ_build',JSON.stringify(buildTeam));
    localStorage.setItem('champ_build_items',JSON.stringify(buildItems));
  }

  // Rebuild add/remove logic without relying on fragile inline event state.
  addBuild=function(name){
    const m=mons.find(x=>x.name===name);
    if(!m)return;
    const exact=buildTeam.findIndex(x=>x.name===name);
    if(exact>=0){
      const removed=buildTeam[exact];
      buildTeam.splice(exact,1);
      if(removed?.name)delete buildItems[removed.name];
    }else{
      const key=speciesKey(m);
      const same=buildTeam.find(x=>speciesKey(x)===key);
      if(same){alert(`${same.name} と ${m.name} は同じ種族なので同時には登録できません。`);return;}
      if(buildTeam.length>=6){alert('6匹までです');return;}
      buildTeam.push({...m});
      if(m.mega)buildItems[m.name]=megaStoneFor(m);
    }
    v1811PersistBuild();
    try{V12_PROFILE_CACHE.clear();}catch(e){}
    renderBuildCurrent();
    renderBuildRoster();
    try{renderTeamCompletion();}catch(e){}
    try{renderHomeV18();}catch(e){}
  };

  renderBuildRoster=function(){
    if(!buildRoster)return;
    const q=normalizePokemonSearch((buildSearch?.value||'').trim());
    const filtered=mons.filter(m=>!q||normalizePokemonSearch(m.name).includes(q));
    const action=m=>{
      const safe=String(m.name).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      return `<div class="monActions" style="grid-template-columns:1fr"><button type="button" class="mineAdd" data-v1811-build="${safe}">${buildTeam.some(x=>x.name===m.name)?'解除':'構築＋'}</button></div>`;
    };
    buildRoster.innerHTML=sortBrowseMons(filtered,browseSort.build).map(m=>browseCard(m,action(m))).join('');
    buildRoster.querySelectorAll('[data-v1811-build]').forEach(btn=>{
      btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();addBuild(btn.dataset.v1811Build);});
    });
  };

  // The saved-party roster historically calls addSavedMon; guarantee that alias exists and
  // use normal event listeners there as well.
  addSavedMon=function(name){return addSaved(name);};
  renderSavedRoster=function(){
    if(!savedRoster)return;
    const q=normalizePokemonSearch((savedSearch?.value||'').trim());
    const filtered=mons.filter(m=>!q||normalizePokemonSearch(m.name).includes(q));
    const action=m=>{
      const safe=String(m.name).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
      return `<div class="monActions" style="grid-template-columns:1fr"><button type="button" class="mineAdd" data-v1811-saved="${safe}">${savedParty.some(x=>x.name===m.name)?'解除':'登録＋'}</button></div>`;
    };
    savedRoster.innerHTML=sortBrowseMons(filtered,browseSort.saved).map(m=>browseCard(m,action(m))).join('');
    savedRoster.querySelectorAll('[data-v1811-saved]').forEach(btn=>{
      btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();addSaved(btn.dataset.v1811Saved);});
    });
  };

  // Generic Mega-only base-form filter. This does not depend on a hand-maintained list of
  // newly added Megas: if a species has a Mega, its base form needs strong non-Mega item
  // evidence (or an explicit proven-base exception) to be recommended as the base form.
  const v1811PreviousFormPolicy=v14FormPolicy;
  v14FormPolicy=function(m){
    const base=v1811PreviousFormPolicy(m);
    if(!m||m.mega||!base.hasMega)return base;
    if(typeof baseFormViable!=='undefined'&&baseFormViable.has(m.name))return base;

    const rows=(envData(m)?.items||[]).slice(0,20);
    const megas=v14MegaFormsFor(m);
    let nonMegaMax=0,nonMegaSum=0,megaSum=0,hasPct=false;
    for(const row of rows){
      const pct=v14ItemPct(row);if(pct>0)hasPct=true;
      const isMega=megas.some(mg=>typeof v15StoneMatchesRow==='function'&&v15StoneMatchesRow(row,mg));
      if(isMega)megaSum+=pct;
      else {nonMegaMax=Math.max(nonMegaMax,pct);nonMegaSum+=pct;}
    }
    const provenNonMega=hasPct&&(nonMegaMax>=35||nonMegaSum>=55);
    if(provenNonMega)return {...base,hardExclude:false,evidence:Math.max(base.evidence,.9),reason:`通常形態の採用実績あり（最大 ${v15FmtPct(nonMegaMax)}）`};
    return {...base,hardExclude:true,evidence:Math.min(base.evidence,.12),reason:megaSum>0?`メガ前提の採用傾向（メガ石 ${v15FmtPct(megaSum)}）`:'メガ形態前提で、通常形態の独立した採用根拠が弱い'};
  };
  v14RecommendableForm=function(m){return !v14FormPolicy(m).hardExclude;};

  // Re-render immediately so the registration buttons use the reliable handlers now.
  try{renderBuildRoster();}catch(e){console.error('v18.11 build roster',e);}
  try{renderSavedRoster();}catch(e){console.error('v18.11 saved roster',e);}

  window.__V1811_SELFTEST__={
    buildAdd:typeof addBuild==='function',
    savedAlias:typeof addSavedMon==='function',
    formPolicy:typeof v14FormPolicy==='function'
  };
  document.documentElement.setAttribute('data-v1811-selftest',Object.values(window.__V1811_SELFTEST__).every(Boolean)?'ok':'fail');
})();
</script>
'''
          if '</body>' not in s:
              raise SystemExit('body close marker not found')
          s=s.replace('</body>',patch+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(parts),encoding='utf-8')
          assert 'v18.11: reliable builder' in s
          assert 'addNeed(u.removal<15,cp.removal,.6,null);' in s
          assert 'currentMegaCount>=2' in s
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix builder registration and practical recommendations"
          git push
