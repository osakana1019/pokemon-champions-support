name: Apply defensive counter stability

on:
  push:
    paths:
      - 'tools/patch_v18_5.py'
      - '.github/workflows/counter-defense-v18-5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v18.5 patch
        run: python tools/patch_v18_5.py

      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/app.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('script blocks',len(blocks))
          PY
          node --check /tmp/app.js

      - name: Commit patched app
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Weight defensive typing in counter recommendations'
          git push
