name: Apply single-name counter picker

on:
  push:
    paths:
      - 'scripts/fix-counter-picker-v18-6.py'
      - '.github/workflows/counter-picker-v18-6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch index
        run: python scripts/fix-counter-picker-v18-6.py
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.rfind('<script>')
          end=s.rfind('</script>')
          Path('/tmp/app.js').write_text(s[start+8:end],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Show single counter name while keeping kana search'
            git push
          fi
