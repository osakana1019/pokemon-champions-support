name: Exact-form elite evidence v19.3

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_v19_3_form_evidence.py'
      - '.github/workflows/exact-form-evidence-v19-3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v19.3 patch
        run: python scripts/fix_v19_3_form_evidence.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'Pokémon Champions Support — v19.3' in s
          assert 'v19.3: exact-form elite evidence' in s
          assert 'washDoesNotLeak' in s
          parts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app-v193.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/app-v193.js
      - name: Commit app update
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Separate alternate-form elite evidence"
          git push
