name: Apply Champions held-item fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_v18_items.py'
      - '.github/workflows/fix-items-v18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply held-item whitelist
        run: python scripts/fix_v18_items.py

      - name: Commit patched app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix Champions held-item availability'
            git push
          fi
