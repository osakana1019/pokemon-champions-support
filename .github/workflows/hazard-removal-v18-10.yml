name: Update Champions hazard removal rules
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'Pokémon Champions Support — v18.10' in s:
              raise SystemExit(0)
          s=s.replace('Pokémon Champions Support — v18.9','Pokémon Champions Support — v18.10')
          s=s.replace("const V12_REMOVE_MOVES=new Set(['こうそくスピン','きりばらい','コートチェンジ']);",
                      "const V12_REMOVE_MOVES=new Set(['きりばらい','こうそくスピン','キラースピン','おかたづけ']);")
          s=s.replace("removal:new Set(['rapidspin','defog','courtchange']),",
                      "removal:new Set(['defog','rapidspin','mortalspin','tidyup']),")
          s=s.replace("advice.push('ステルスロック・まきびし等の除去手段が薄い')",
                      "advice.push('ステロ・まきびし対策（きりばらい/スピン系）が薄い')")
          # Current Champions does not have Heavy-Duty Boots available; never treat it as hazard mitigation.
          s=s.replace("['heavydutyboots']", "['__champions_unavailable_heavy_duty_boots__']")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use current Champions hazard removal options"
          git push
