name: PokeDB-inspired battle intelligence v19

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pokedb_intel_v19.py'
      - '.github/workflows/pokedb-intel-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v19 intelligence patch
        run: python scripts/pokedb_intel_v19.py
      - name: Validate app JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'Pokémon Champions Support — v19.0' in s
          assert 'v19.0: PokeDB-inspired live battle intelligence' in s
          assert 'api/battle/${V19_FMT}' in s
          assert 'PokeDB上位構築' in s
          parts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app-v19.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/app-v19.js
      - name: Commit app update
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add live trends speed tiers and build intelligence"
          git push
