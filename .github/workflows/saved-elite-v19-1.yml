name: Saved input and elite synergy v19.1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_v19_1_saved_elite.py'
      - 'scripts/fix_v19_1_runtime.py'
      - '.github/workflows/saved-elite-v19-1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v19.1 patch
        run: |
          python scripts/fix_v19_1_saved_elite.py
          python scripts/fix_v19_1_runtime.py
      - name: Validate JavaScript and regression markers
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'Pokémon Champions Support — v19.1' in s
          assert 'v19.1: stable saved move input + elite team synergy' in s
          assert 'v19.1b: elite summary runtime hardening' in s
          assert 'V191_ELITE_BUILDS' in s
          assert 'renderSavedEditors() here' in s
          assert 'new MutationObserver(()=>setTimeout(v191AppendEliteSummary' not in s
          parts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app-v191.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/app-v191.js
      - name: Commit app update
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix saved move typing and add elite team co-use"
          git push
