name: v20.8 official zukan artwork and labeled rail

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v20_2_patch.py'
      - 'scripts/v20_2_quick.py'
      - 'scripts/v20_2_home.py'
      - 'scripts/v20_4_sidebar_css.py'
      - 'scripts/v20_4_sidebar_js.py'
      - '.github/workflows/v20-2-home-quick-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply app patches
        run: |
          python scripts/v20_2_patch.py
          python scripts/v20_2_quick.py
          python scripts/v20_2_home.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'Pokémon Champions Support — v20.8' in s
          assert 'v20.5 minimal rail + contrast' in s
          assert 'v20.5 party workflow + rail' in s
          assert 'v20.6 source clarity + meter normalization' in s
          assert 'v20.8 labeled rail' in s
          assert 'v20.8 official zukan artwork + labeled rail' in s
          assert 'zukan.pokemon.co.jp/zukan-api/up/images/index/' in s
          assert 'V208_ZUKAN_ART' in s
          assert 'v208RailLabel' in s
          if 'メガカイリュー' in s:
              assert re.search(r'"メガカイリュー":"https://zukan\.pokemon\.co\.jp/zukan-api/up/images/index/',s)
          if 'メガスターミー' in s:
              assert re.search(r'"メガスターミー":"https://zukan\.pokemon\.co\.jp/zukan-api/up/images/index/',s)
          js='\n'.join(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/v208.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v208.js
      - name: Commit app update
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use official Pokemon Zukan artwork and labeled rail'
          git push
