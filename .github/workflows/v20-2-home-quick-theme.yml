name: v20.2 home quick theme

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v20_2_patch.py'
      - 'scripts/v20_2_quick.py'
      - 'scripts/v20_2_home.py'
      - '.github/workflows/v20-2-home-quick-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply app patches
        run: |
          python scripts/v20_2_patch.py
          python scripts/v20_2_quick.py
          python scripts/v20_2_home.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'Pokémon Champions Support — v20.4' in s
          assert 'v20.2 theme settings' in s
          assert 'v20.2 strict quick set logic' in s
          assert 'v20.2 original clean home' in s
          assert 'v20.4 sidebar styles' in s
          assert 'v20.4 sidebar behavior' in s
          assert '/sprites/home-centered/' in s
          js='\n'.join(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S))
          pathlib.Path('/tmp/v204.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/v204.js
      - name: Commit app update
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add slim home and desktop sidebar'
          git push
