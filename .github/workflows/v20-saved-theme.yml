name: Saved move restore and v20 theme

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v20_saved_restore_theme.py'
      - '.github/workflows/v20-saved-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v20 patch
        run: python scripts/v20_saved_restore_theme.py
      - name: Validate JavaScript and v20 markers
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert 'Pokémon Champions Support — v20.0' in s
          assert 'v20.0: saved move restore + obsidian teal theme' in s
          assert 'partialPreserved' in s
          assert 'v20-theme' in s
          parts=re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/app-v20.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/app-v20.js
      - name: Commit app update
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore saved moves and refresh app theme"
          git push
